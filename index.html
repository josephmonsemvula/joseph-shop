<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f4d"><title>JOSSELL SHOP</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--p:#2563eb;--g:#f5b301;--no:#dc2626;--ok:#16a34a;--bg:#eaf1ff;--cd:#fff;--tx:#0f172a;--m:#64748b;--ac:#2563eb}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0b1f4d,#1e3a8a 55%,#1d4ed8) fixed;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:1180px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;background:linear-gradient(180deg,#dce9ff,#f2f7ff 40%,#dfeaff);animation:in .5s ease;box-shadow:0 0 70px #0008}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 #f5b30099}50%{box-shadow:0 0 0 16px #f5b30000}}
@keyframes logoFx{0%{opacity:0;transform:scale(.3) rotate(-16deg);filter:blur(12px)}9%{opacity:1;transform:scale(1.14) rotate(3deg);filter:blur(0)}14%{transform:scale(.97) rotate(0)}18%,80%{opacity:1;transform:scale(1);filter:blur(0)}90%{opacity:0;transform:scale(.35) rotate(14deg);filter:blur(12px)}100%{opacity:0;transform:scale(.3) rotate(-16deg);filter:blur(12px)}}
@keyframes glow{0%,100%{box-shadow:0 10px 30px #0006,0 0 0 0 #f5b30000}50%{box-shadow:0 14px 34px #0007,0 0 34px 8px #f5b3009a}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes rise{0%{transform:translateY(70px) scale(.5) rotate(-20deg);opacity:0}30%{opacity:1}100%{transform:translateY(-24px) scale(1.25) rotate(14deg);opacity:0}}
@keyframes popin{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
img.logo{width:96px;height:96px;border-radius:26px;object-fit:cover;animation:logoFx 7s ease-in-out infinite,glow 3.5s ease-in-out infinite}
.spin2{width:38px;height:38px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
.load{padding:50px 24px;text-align:center;color:var(--m);display:grid;gap:14px;justify-items:center}.load .spin2{border-color:#cbd5e1;border-top-color:var(--ac)}.hero .load{color:#fff}.hero .load .spin2{border-color:#ffffff44;border-top-color:#fff}
#app.hero,#app.lp .lp-h{background:linear-gradient(160deg,#0b1f4d,#1d4ed8 65%,#3b82f6);color:#fff}
#app.hero{align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:14px}
#app.hero p,#app.hero small{opacity:.92}#app.hero h1{font-size:28px;line-height:1.15}#app.hero a:not(.btn),#app.hero .link{color:#fff}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 8px 22px #0003}.btn:active{transform:scale(.97)}.btn.gold{background:linear-gradient(135deg,var(--g),#ff9d00);color:#0b1f4d}.btn.wa{background:#16a34a}.btn.red{background:var(--no)}.btn.ghost{background:#ffffff22;border:1.5px solid #ffffff88}.btn.ghost2{background:#64748b}
.btn.sm{width:auto;padding:9px 13px;font-size:14px}.pulse{animation:pu 1.8s infinite}
.inst{display:none}body.canin .inst{display:block}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:12px;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #2563eb22}
label{font-size:13px;font-weight:600;color:var(--m)}.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
.link{background:0;border:0;color:var(--ac);font:600 14px system-ui;cursor:pointer;text-decoration:underline}
.center{display:grid;gap:12px;width:100%;max-width:440px;justify-items:center}.center>*{width:100%}.center img.logo{width:96px}
.split{display:grid;gap:22px;width:100%;max-width:980px;align-items:center;text-align:left}.split .pitch{display:grid;gap:12px;justify-items:start}
.fcard{background:#ffffff1f;border:1px solid #ffffff44;border-radius:22px;padding:22px;display:grid;gap:11px;backdrop-filter:blur(8px);text-align:left}.fcard a{color:#fff;text-align:center}.fcard .chk{color:#e0eaff}
.feats{list-style:none;display:grid;gap:8px;background:#ffffff18;padding:14px 18px;border-radius:16px;text-align:left}

/* landing */

.cta{display:grid;gap:10px;width:100%;max-width:420px}.lp-h .btn.inst{max-width:420px}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:fl 8s ease-in-out infinite;z-index:0!important}.b1{width:260px;height:260px;background:#f5b301;top:-60px;left:-70px}.b2{width:300px;height:300px;background:#60a5fa;bottom:-90px;right:-80px;animation-delay:-3s}
.lp-b{padding:30px 18px 40px;display:grid;gap:22px;max-width:1000px;margin:0 auto;width:100%}.lp-b h2{text-align:center;font-size:24px;color:#0b1f4d}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.fc{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px #1d4ed822;display:grid;gap:6px;border-top:4px solid var(--g);animation:popin .6s both}.fc b{font-size:17px}.fc span{font-size:28px}.fc small{color:var(--m)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stp{background:linear-gradient(135deg,#0b1f4d,#1d4ed8);color:#fff;border-radius:20px;padding:18px;display:grid;gap:6px}.stp i{font-style:normal;background:var(--g);color:#0b1f4d;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.mock{background:#fff;border-radius:26px;box-shadow:0 18px 50px #1d4ed844;max-width:340px;margin:0 auto;overflow:hidden;width:100%}.mock .mh{background:linear-gradient(135deg,#e11d48,#7c3aed);height:70px}.mock .mt{padding:12px 14px;font-weight:800}.mock .mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}.mock .mg div{border-radius:14px;height:92px;background:linear-gradient(135deg,#fde68a,#fca5a5)}.mock .mg div:nth-child(2){background:linear-gradient(135deg,#a5f3fc,#c4b5fd)}.mock .mg div:nth-child(3){background:linear-gradient(135deg,#bbf7d0,#fde68a)}.mock .mg div:nth-child(4){background:linear-gradient(135deg,#fbcfe8,#93c5fd)}
.ctab{background:linear-gradient(135deg,#0b1f4d,#1d4ed8);color:#fff;border-radius:26px;padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center}.ctab .btn{max-width:380px}
/* tableau de bord */
header.top{background:linear-gradient(135deg,#0b1f4d,#1d4ed8);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:8}
.row{display:flex;gap:8px;align-items:center}.row b{flex:1;min-width:0}.row.wrap{flex-wrap:wrap}.lg2{width:36px;height:36px;border-radius:11px;object-fit:cover}
#body{flex:1;padding:16px 14px 100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-content:start}#body>.full,#body>.btn,#body>.kp,#body>.sign{grid-column:1/-1}
.card{background:#fffffff2;border-radius:20px;padding:16px;display:grid;gap:9px;box-shadow:0 6px 22px #1d4ed81c;border-top:4px solid var(--ac);animation:popin .4s both;align-content:start}
#body>.card:nth-child(3n+2){border-top-color:var(--ok)}#body>.card:nth-child(3n){border-top-color:var(--g)}.card.warn{border-top-color:var(--g)}
h3{font-size:16px}h4{color:var(--m);font-size:13px;text-transform:uppercase}small{color:var(--m)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{border-radius:18px;padding:14px;color:#fff;display:grid;gap:3px;box-shadow:0 8px 22px #0002}.k span{font-size:12px;opacity:.95}.k b{font-size:18px}.k.a{background:linear-gradient(135deg,#16a34a,#22c55e)}.k.b{background:linear-gradient(135deg,#1d4ed8,#60a5fa)}

.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e2e8f0;color:#334155;white-space:nowrap}.st.new{background:#fef3c7;color:#92400e}.st.paid{background:#dcfce7;color:#166534}.st.delivered{background:#dbeafe;color:#1e40af}.st.cancelled,.st.blocked{background:#fee2e2;color:#991b1b}
.claim{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-radius:12px;padding:8px 12px;font-weight:700}
.ic{border:0;background:#eef2f7;border-radius:10px;padding:8px 10px;cursor:pointer;text-decoration:none;color:inherit;position:relative}.bell i{position:absolute;top:-4px;right:-4px;background:var(--no);color:#fff;font:700 11px system-ui;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;font-style:normal}
.prow{grid-template-columns:56px 1fr auto auto;align-items:center}.prow img{width:56px;height:56px;border-radius:12px;object-fit:cover}.prow small{display:block}
.thumbs{display:flex;gap:8px}.thumbs div{position:relative}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover}.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;background:var(--no);color:#fff;width:20px;height:20px}
.nav{position:fixed;bottom:0;width:100%;max-width:1180px;display:flex;background:#fff;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #0b1f4d33;z-index:9}
.nav button{flex:1;border:0;background:0;color:var(--m);font:600 11px system-ui;padding:6px 0;display:grid;gap:2px;cursor:pointer}.nav button i{font-style:normal;font-size:20px}.nav button.on{color:var(--p)}
@media(min-width:900px){#app.dash{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;align-items:start}#app.dash>header{grid-column:1/-1}#app.dash>.nav{position:sticky;top:64px;grid-column:1;grid-row:2;flex-direction:column;width:auto;max-width:none;box-shadow:none;background:transparent;padding:16px 12px;gap:6px}#app.dash>.nav button{display:flex;align-items:center;gap:10px;font-size:15px;padding:12px 14px;border-radius:14px;text-align:left}#app.dash>.nav button.on{background:#fff;box-shadow:0 6px 18px #1d4ed82a}#app.dash>#body{grid-column:2;grid-row:2;padding-bottom:40px}#app.adm{display:flex}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#bk{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:0;background:#ffffffee;color:#0b1f4d;font-size:20px;box-shadow:0 6px 18px #0004;cursor:pointer}#bk[hidden]{display:none}
[hidden]{display:none!important}.g9{display:grid;gap:9px}.full{grid-column:1/-1}
.ins{background:#eef2f7;border-radius:12px;padding:10px;color:#111827;line-height:1.7}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:7px 8px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.tb th{color:var(--m)}
details{background:#eef2f7;border-radius:12px;padding:10px;color:#111827}summary{font-weight:600;cursor:pointer}details p{margin-top:6px;color:#475569}
.sign{background:linear-gradient(135deg,#0b1f4d,#1d4ed8);color:#fff;border-radius:18px;padding:16px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{border:1.5px solid var(--ac);background:#fff;color:var(--ac);border-radius:99px;padding:6px 14px;white-space:nowrap;font:600 13px system-ui;cursor:pointer}.chip.on{background:var(--ac);color:#fff}
/* boutique publique */
.st-w{background:radial-gradient(900px 420px at 50% -80px,color-mix(in srgb,var(--ac) 32%,transparent),transparent),radial-gradient(600px 400px at 100% 40%,color-mix(in srgb,var(--ac) 14%,transparent),transparent),var(--bg);color:var(--tx);min-height:100vh;padding-bottom:110px;font-family:inherit}
.cv{height:170px;background:linear-gradient(135deg,var(--ac),#0b1f4d) center/cover;position:relative}.cv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg))}
.sh2{display:flex;gap:16px;padding:0 18px;margin-top:-46px;align-items:flex-start;position:relative;z-index:1}.sh2 img{width:88px;height:88px;border-radius:24px;object-fit:cover;background:#fff;border:4px solid var(--bg);box-shadow:0 10px 26px #0005;flex:none}

.bar{padding:16px 18px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:200px}.seg{display:flex;background:var(--cd);border-radius:12px;padding:3px;box-shadow:0 3px 10px #0002}.seg button{border:0;background:0;color:var(--tx);padding:8px 11px;border-radius:9px;cursor:pointer;font:600 13px system-ui}.seg button.on{background:var(--ac);color:#fff}
.sc{padding:22px 18px 0}.sc h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px}.sc h2::after{content:'';flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ac),transparent)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px}

.pc .in{padding:12px;display:grid;gap:5px;align-content:start;flex:1}.pc .in b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ctaS{margin:34px 18px 0;background:linear-gradient(135deg,var(--ac),#0b1f4d);color:#fff;border-radius:26px;padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center;box-shadow:0 14px 40px #0004}.ctaS .btn{max-width:360px;background:linear-gradient(135deg,var(--g),#ff9d00);color:#0b1f4d}
.st-w footer{padding:22px 18px;text-align:center;color:var(--m);font-size:13px}.st-w footer a{color:var(--ac)}
.cartb{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;border:0;border-radius:99px;padding:15px 26px;font:700 16px system-ui;box-shadow:0 10px 30px #0006;z-index:20;animation:popin .4s both}

.mb{background:var(--cd,#fff);color:var(--tx);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;display:grid;gap:11px;animation:popin .35s both}
@media(min-width:760px){#modal{align-items:center}.mb{border-radius:26px}}
.mclose{justify-self:start;border:0;background:#eef2f7;color:#0f172a;border-radius:99px;padding:7px 14px;font:700 13px system-ui;cursor:pointer}

.lp-h small{color:#dbeafe}.lp-h .btn.inst{max-width:420px}
header .ic{background:#ffffff26;color:#fff}

const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function adm() { return request.auth != null && request.auth.token.email == 'joseph.admin@josselshop.app'; }\n    function me(u) { return request.auth != null && request.auth.uid == u; }\n    function shopOf(s) { return get(/databases/$(database)/documents/shops/$(s)).data; }\n\n    match /shops/{s} {\n      allow read: if true;\n      allow create: if me(request.resource.data.uid) && request.resource.data.status == 'active' && request.resource.data.cpaid == 0;\n      allow update: if adm() || (me(resource.data.uid)\n        && request.resource.data.uid == resource.data.uid\n        && request.resource.data.cpaid == resource.data.cpaid\n        && request.resource.data.status == resource.data.status);\n      allow delete: if adm();\n    }\n    match /products/{p} {\n      allow read: if true;\n      allow create: if me(request.resource.data.uid) && shopOf(request.resource.data.slug).uid == request.auth.uid && shopOf(request.resource.data.slug).status == 'active';\n      allow update, delete: if adm() || me(resource.data.uid);\n    }\n    match /private/{p} {\n      allow create: if me(request.resource.data.uid);\n      allow read, update, delete: if adm() || me(resource.data.uid);\n    }\n    match /orders/{o} {\n      allow get: if true;\n      allow list: if adm() || (request.auth != null && resource.data.uid == request.auth.uid);\n      allow create: if request.resource.data.status == 'new' && shopOf(request.resource.data.slug).status == 'active' && request.resource.data.uid == shopOf(request.resource.data.slug).uid;\n      allow update: if adm()\n        || (me(resource.data.uid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','files','hid']))\n        || (resource.data.status == 'new' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['claim','pm']));\n      allow delete: if adm();\n    }\n    match /notifs/{n} {\n      allow create, delete: if adm();\n      allow read: if adm() || (request.auth != null && resource.data.uid == request.auth.uid);\n      allow update: if adm() || (me(resource.data.uid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['read']));\n    }\n    match /msgs/{m} {\n      allow create: if me(request.resource.data.uid);\n      allow read: if adm() || me(resource.data.uid);\n      allow update, delete: if adm();\n    }\n  }\n}\n";
