<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--p:#2563eb;--g:#f5b301;--no:#dc2626;--ok:#16a34a;--bg:#eef3fb;--cd:#fff;--tx:#0f172a;--m:#64748b;--ac:#2563eb}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1f4d;color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#dfe9fb,#f4f8ff 45%,#dfe9fb);display:flex;flex-direction:column;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 #f5b30088}50%{box-shadow:0 0 0 14px #f5b30000}}
#app.hero{background:linear-gradient(160deg,#0b1f4d,#1d4ed8 70%,#3b82f6);color:#fff;align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:14px}
.hero p,.hero small{opacity:.9}.hero h1{font-size:28px;line-height:1.15}.hero a:not(.btn),.hero .link{color:#fff}
.logo{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 30px #0006;object-fit:cover}
.feats{list-style:none;display:grid;gap:8px;text-align:left;background:#ffffff18;padding:14px 18px;border-radius:16px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:700 16px system-ui;text-align:center;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.97)}.btn.gold{background:linear-gradient(135deg,var(--g),#ff9d00);color:#0b1f4d}.btn.wa{background:#16a34a}.btn.red{background:var(--no)}.btn.ghost{background:#ffffff22;border:1.5px solid #ffffff88}.btn.ghost2{background:#94a3b8}
.btn.sm{width:auto;padding:9px 13px;font-size:14px}.pulse{animation:pu 1.8s infinite}
.inst{display:none}body.canin .inst{display:block}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:12px;font:15px system-ui;background:var(--cd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
label{font-size:13px;font-weight:600;color:var(--m)}.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
.form{padding:28px 22px;display:grid;gap:11px;align-content:center;min-height:100vh}.form .logo{margin:0 auto}.form h2,.form>a{text-align:center}.form>a{color:#fff}
#app.hero .form{width:100%}
.center{display:grid;gap:12px;width:100%}.center .logo{margin:0 auto}
.link{background:0;border:0;color:var(--ac);font:600 14px system-ui;cursor:pointer}
header.top{background:linear-gradient(135deg,#0b1f4d,#1d4ed8);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.row{display:flex;gap:8px;align-items:center}.row b{flex:1;min-width:0}.row.wrap{flex-wrap:wrap}.lg2{width:34px;height:34px;border-radius:10px}
#body{flex:1;padding:14px 14px 90px;display:grid;gap:12px;align-content:start}
.card{background:var(--cd);border-radius:18px;padding:15px;display:grid;gap:9px;box-shadow:0 4px 18px #0b1f4d14;border-top:4px solid var(--ac)}
.card.warn{border-top-color:var(--g)}h3{font-size:16px}h4{color:var(--m);font-size:13px;text-transform:uppercase;margin-top:4px}small{color:var(--m)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{border-radius:16px;padding:13px;color:#fff;display:grid;gap:3px}.k span{font-size:12px}.k b{font-size:17px}.k.a{background:linear-gradient(135deg,#16a34a,#22c55e)}.k.b{background:linear-gradient(135deg,#1d4ed8,#60a5fa)}
.empty{border:2px dashed #94a3b8aa;border-radius:14px;padding:14px;text-align:center;color:var(--m)}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e2e8f0;color:#334155}.st.new{background:#fef3c7;color:#92400e}.st.paid{background:#dcfce7;color:#166534}.st.delivered{background:#dbeafe;color:#1e40af}.st.cancelled,.st.blocked{background:#fee2e2;color:#991b1b}
.ic{border:0;background:#eef2f7;border-radius:10px;padding:8px 10px;cursor:pointer;text-decoration:none;color:inherit}
.prow{grid-template-columns:56px 1fr auto auto;align-items:center}.prow img{width:56px;height:56px;border-radius:12px;object-fit:cover}.prow small{display:block}
.thumbs{display:flex;gap:8px}.thumbs div{position:relative}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover}.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;background:var(--no);color:#fff;width:20px;height:20px}
.nav{position:fixed;bottom:0;width:100%;max-width:560px;display:flex;background:#fff;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #0b1f4d22;z-index:6}
.nav button{flex:1;border:0;background:0;color:var(--m);font:600 11px system-ui;padding:6px 0;display:grid;gap:2px;cursor:pointer}.nav button i{font-style:normal;font-size:20px}.nav button.on{color:var(--p)}
.load{padding:40px;text-align:center;color:var(--m)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
/* boutique */
.st-w{background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px}
.sh{background:var(--ac);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 20px;display:flex;gap:14px;align-items:center}.sh img{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#fff}.sh h1{font-size:22px}.sh p{opacity:.9;font-size:14px}
.bar{padding:12px 14px 0}.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}.chip{border:1.5px solid var(--ac);background:var(--cd);color:var(--ac);border-radius:99px;padding:6px 14px;white-space:nowrap;font:600 13px inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px}
.pc{background:var(--cd);border-radius:16px;padding:10px;display:grid;gap:6px;box-shadow:0 3px 14px #0002;cursor:pointer}.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.pc span{color:var(--ac);font-weight:800}.pc .btn{width:100%}
.st-w footer{padding:20px 16px;text-align:center;color:var(--m);font-size:13px}.st-w footer a{color:var(--ac)}
.cartb{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;border:0;border-radius:99px;padding:14px 24px;font:700 16px system-ui;box-shadow:0 8px 24px #0006;z-index:20}
#modal{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.mb{background:var(--cd,#fff);color:var(--tx);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:grid;gap:10px}
.snap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px}.snap img{width:100%;flex:none;scroll-snap-align:center;border-radius:14px;aspect-ratio:1;object-fit:cover}
</style></head><body><div id="app"></div><div id="modal" hidden></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,addDoc,query,where,getDocs}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBd52LzCq55S8hWpIAWQmOqg1R70Cb7Qt8",authDomain:"josell-shop.firebaseapp.com",projectId:"josell-shop",storageBucket:"josell-shop.firebasestorage.app",messagingSenderId:"1060962016287",appId:"1:1060962016287:web:3ef14f31078b9af7c1092a"}),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const WA='243897997253',ADM='joseph.admin@josselshop.app',AH='f092d8c6719c8a11b2a58bbbb7b3bd3ca7c7c305cf4d9e8afbfffd6717845a11',DOM='@josselshop.app';
const v=id=>($('#'+id)?.value||'').trim(),sum=(a,k)=>a.reduce((x,y)=>x+(+y[k]||0),0);
const fm=(n,c)=>(+n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+(c||'FC');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200)};
const norm=p=>{p=String(p).replace(/\D/g,'');return p.length==10&&p[0]=='0'?'243'+p.slice(1):p};
const wl=(p,t)=>'https://wa.me/'+norm(p)+(t?'?text='+encodeURIComponent(t):'');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const view=(h,c='')=>{$('#app').className=c;$('#app').innerHTML=h};
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
const PM={orange:['Orange Money','🟠'],mpesa:['M-Pesa','🟢'],airtel:['Airtel Money','🔴'],africell:['Africell Money','🟣'],equity:['Equity BCDC (banque)','🏦'],autre:['Autre moyen','💳']};
const PMN=(k,s)=>k=='autre'?((s&&s.payl)||'Autre moyen'):(PM[k]?PM[k][0]:k);
const CATS=['Vêtements','Chaussures','Montres & bijoux','Électronique','Photos','Vidéos','Formations & fichiers','Services','Beauté','Alimentation','Autres'];
const ST={new:'🆕 Nouvelle',paid:'✅ Payée',delivered:'🚚 Livrée',cancelled:'✖ Annulée'};
const link=s=>location.href.split('#')[0]+'#/s/'+s;
const rs=(f,m,q)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)});
let U=null,SH=null,tab='orders',busy=0,dp,ED=null,PH=[],PL=[],OR=[],LOGO,STO=null,cart={},fc='',fq='',AS=[],AO=[],GC={},tp=0,tl=0;
const prods=async s=>(await getDocs(query(collection(db,'products'),where('slug','==',s)))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);
async function load(){SH=null;if(U&&U.email!==ADM){const q=await getDocs(query(collection(db,'shops'),where('uid','==',U.uid)));if(q.docs[0])SH={id:q.docs[0].id,...q.docs[0].data()}}}
const modal=h=>{$('#modal').innerHTML='<div class="mb">'+h+'</div>';$('#modal').hidden=false};const close=()=>{$('#modal').hidden=true};

/* ---------- installation ---------- */
const stdl=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!stdl)document.body.classList.add('canin')});
addEventListener('appinstalled',()=>{dp=null;document.body.classList.remove('canin')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- administration cachée : 10 appuis sur le logo ---------- */
function tap10(){const n=Date.now();tp=n-tl>1500?1:tp+1;tl=n;if(tp>=10){tp=0;adminLogin()}}
async function adminLogin(){const c=prompt('🔐 Code secret administrateur');if(c===null)return;if(await sha(c.trim())!==AH)return toast('Code incorrect');
 busy=1;try{try{await signInWithEmailAndPassword(auth,ADM,c.trim())}catch(e){await createUserWithEmailAndPassword(auth,ADM,c.trim())}}catch(e){busy=0;return toast('Accès refusé')}
 busy=0;U=auth.currentUser;SH=null;location.hash='#/admin';route()}

/* ---------- routeur ---------- */
onAuthStateChanged(auth,async u=>{if(busy)return;U=u;await load();route()});
addEventListener('hashchange',route);
async function route(){const p=location.hash.slice(1).split('/').filter(Boolean);scrollTo(0,0);close();
 if(p[0]=='s')return store(p[1]);if(p[0]=='o')return order(p[1]);if(p[0]=='admin')return admin();
 if(p[0]=='login')return login();if(p[0]=='signup')return signup();
 if(U&&U.email==ADM)return admin();if(U)return dash();landing()}

function landing(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!stdl;
 view(`<img class="logo tap10" src="icon-192.png" alt="JOSSELL SHOP"><h1>Bienvenue sur<br>JOSSELL SHOP</h1><p>Ouvrez votre boutique en ligne en quelques minutes et partagez-la par un simple lien. Vos clients commandent et paient par mobile money ou banque.</p>
 <ul class="feats"><li>🛍️ Vendez tout : vêtements, chaussures, montres, photos, vidéos, formations…</li><li>📲 Orange Money, M-Pesa, Airtel, Africell, Equity BCDC</li><li>🎨 Le design de votre boutique, à votre image</li><li>🚚 Livraison express partout, sur demande</li></ul>
 <button class="btn gold pulse inst" data-a="inst">📲 Installer l’application</button>${ios?'<small>iPhone : touchez Partager ⬆️ puis « Sur l’écran d’accueil ».</small>':''}
 <a class="btn" href="#/signup">🏪 Créer ma boutique</a><a class="btn ghost" href="#/login">Se connecter</a>
 <small>Besoin d’aide pour installer ou ouvrir votre boutique ?<br><a href="${wl(WA,'Bonjour Joseph, je veux ouvrir ma boutique JOSSELL SHOP.')}" target="_blank" rel="noopener">💬 Joseph Monsemvula • +243 897 997 253</a></small><small>Conçu par Joseph Monsemvula</small>`,'hero')}
function login(){view(`<div class="form"><img class="logo tap10" src="icon-192.png"><h2>Connexion</h2><input id="lph" type="tel" placeholder="Numéro de téléphone"><input id="lpw" type="password" placeholder="Mot de passe"><button class="btn gold" data-a="dologin">Se connecter</button><a href="#/signup">Créer ma boutique</a><a href="#/">← Retour</a></div>`,'hero')}
function signup(){view(`<div class="form"><img class="logo tap10" src="icon-192.png"><h2>Créer ma boutique</h2><input id="gn" placeholder="Votre nom complet"><input id="gs" placeholder="Nom de votre boutique"><input id="gp" type="tel" placeholder="Numéro de téléphone (WhatsApp)"><input id="gw" type="password" placeholder="Mot de passe (6 caractères min.)">
 <label class="chk" style="color:#dbeafe"><input id="gt" type="checkbox"> J’accepte de verser 10 % de commission JOSSELL SHOP sur chaque commande et j’autorise Joseph Monsemvula à voir mes coordonnées et mes commandes pour gérer mon compte.</label><button class="btn gold" data-a="dosignup">Créer mon compte</button><a href="#/login">J’ai déjà un compte</a><a href="#/">← Retour</a></div>`,'hero')}
const aerr=e=>({'auth/invalid-credential':'Numéro ou mot de passe incorrect.','auth/email-already-in-use':'Ce numéro a déjà un compte.','auth/weak-password':'Mot de passe trop court.','auth/network-request-failed':'Pas de connexion internet.'}[e.code]||'Erreur : '+(e.code||e.message));

/* ---------- espace vendeur ---------- */
async function dash(){if(!SH){view('<div class="load">Chargement…</div>');await load()}
 if(!SH)return view(`<div class="center"><img class="logo" src="icon-192.png"><h2>Aucune boutique trouvée</h2><p>Contactez Joseph Monsemvula.</p><a class="btn wa" href="${wl(WA)}" target="_blank" rel="noopener">💬 WhatsApp</a><button class="link" data-a="out">Se déconnecter</button></div>`,'hero');
 if(SH.status!='active')return view(`<div class="center"><img class="logo tap10" src="icon-192.png"><h2>${SH.status=='blocked'?'Boutique suspendue':'Compte en attente d’autorisation'}</h2><p>${SH.status=='blocked'?'Votre boutique est suspendue. Contactez Joseph Monsemvula.':'Bienvenue '+E(SH.owner)+' ! Contactez Joseph Monsemvula : il vous donnera un code d’accès à 4 chiffres pour activer votre boutique.'}</p><a class="btn wa" href="${wl(WA,'Bonjour Joseph, je suis '+SH.owner+' ('+SH.phone+'), boutique '+SH.name+'. Je demande mon code d’accès JOSSELL SHOP.')}" target="_blank" rel="noopener">💬 Contacter Joseph</a>${SH.status=='pending'?'<input id="ac" maxlength="4" inputmode="numeric" placeholder="Code à 4 chiffres" style="text-align:center;font-size:22px"><button class="btn gold" data-a="act">Activer ma boutique</button>':''}<button class="link" data-a="out">Se déconnecter</button></div>`,'hero');
 view(`<header class="top"><div class="row"><img class="lg2" src="${SH.logo||'icon-192.png'}"><b>${E(SH.name)}</b></div><button class="ic" data-a="out">⏻</button></header><div id="body"></div><nav class="nav">${[['orders','🛍️','Commandes'],['prods','📦','Produits'],['shop','🏪','Boutique'],['link','🔗','Mon lien']].map(t=>`<button data-a="tab" data-k="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`);tabRender()}
async function tabRender(){const b=$('#body');if(!b)return;b.innerHTML='<div class="load">Chargement…</div>';try{b.innerHTML=await({orders:tOrders,prods:tProducts,shop:tShop,link:tLink}[tab])()}catch(e){b.innerHTML='<div class="empty">'+(e.code=='permission-denied'?'Publiez d’abord les règles Firebase (voir ETAPE-1).':'Erreur : '+E(e.code||e.message))+'</div>'}$$('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.k==tab))}
const oc=o=>`<div class="card"><div class="row"><b>${E(o.cname)}</b><span class="st ${o.status}">${ST[o.status]}</span></div><small>${new Date(o.created).toLocaleString('fr-FR')} • ${E(o.cphone)}${o.city?' • '+E(o.city):''}</small>${o.items.map(i=>`<div class="row"><span>${i.q} × ${E(i.n)}</span><b style="flex:none">${fm(i.p*i.q,o.cur)}</b></div>`).join('')}<div class="row"><b>Total</b><b style="flex:none">${fm(o.total,o.cur)}</b></div><small>💳 ${E(PMN(o.pm,SH))} • Réf : ${E(o.ref||'—')}${o.express?'<br>🚚 Livraison express demandée':''}${o.addr?'<br>📍 '+E(o.addr):''}</small><div class="row wrap">${o.status=='new'?`<button class="btn sm" data-a="ost" data-k="${o.id}|paid">✅ Paiement reçu</button>`:''}${o.status=='paid'?`<button class="btn sm" data-a="ost" data-k="${o.id}|delivered">🚚 Livré</button>`:''}${o.status=='new'||o.status=='paid'?`<button class="btn sm red" data-a="ost" data-k="${o.id}|cancelled">✖ Annuler</button>`:''}<a class="btn sm wa" href="${wl(o.cphone,'Bonjour '+o.cname+', concernant votre commande chez '+SH.name)}" target="_blank" rel="noopener">💬</a></div></div>`;
async function tOrders(){const q=await getDocs(query(collection(db,'orders'),where('uid','==',U.uid)));OR=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);
 const ok=OR.filter(o=>o.status!='cancelled'),due=Math.max(0,sum(ok,'commission')-(SH.cpaid||0));
 return `<div class="kp"><div class="k a"><span>Commandes</span><b>${ok.length}</b></div><div class="k b"><span>Ventes</span><b>${fm(sum(ok,'total'),SH.cur)}</b></div></div>
 <div class="card warn"><h3>💼 Commission JOSSELL à payer : ${fm(due,SH.cur)}</h3><small>10 % par commande. Envoyez-la sur Orange Money <b>0897997253</b> (Joseph Monsemvula).</small><a class="btn wa" href="${wl(WA,'Bonjour Joseph, j’ai payé ma commission JOSSELL SHOP ('+fm(due,SH.cur)+'). Boutique : '+SH.name)}" target="_blank" rel="noopener">💬 J’ai payé, prévenir Joseph</a></div>${OR.map(oc).join('')||'<div class="empty">Aucune commande pour le moment. Partagez votre lien !</div>'}`}
const pform=()=>`<div class="card"><h3>${ED.id?'✏️ Modifier le produit':'🆕 Nouveau produit'}</h3><label>Nom</label><input id="pn" value="${E(ED.name||'')}"><label>Prix (${SH.cur})</label><input id="pp" type="number" min="0" value="${ED.price??''}"><label>Catégorie</label><select id="pc">${CATS.map(c=>`<option ${ED.cat==c?'selected':''}>${c}</option>`).join('')}</select><label>Description</label><textarea id="pd" rows="3">${E(ED.desc||'')}</textarea><label>Photos (3 maximum)</label><input id="pf" type="file" accept="image/*" multiple><div class="thumbs" id="th">${thumbs()}</div><label>Lien de livraison numérique, privé (photos, vidéos, fichiers, formations)</label><input id="pl" placeholder="Lien Google Drive, etc. (facultatif)" value="${E(ED.dl||'')}"><label class="chk"><input id="ph" type="checkbox" ${ED.hide?'checked':''}> Masquer ce produit</label><div class="row"><button class="btn" data-a="psave">💾 Enregistrer</button><button class="btn ghost2" data-a="pcancel">Annuler</button></div></div>`;

const tShop=()=>{LOGO=undefined;const s=SH;return `<div class="card" style="justify-items:center"><img class="logo tap10" src="${s.logo||'icon-192.png'}"><small>Votre logo</small><input id="sl" type="file" accept="image/*"></div>
 <div class="card"><h3>🏪 Ma boutique</h3><label>Nom de la boutique</label><input id="sn" value="${E(s.name)}"><label>Description / slogan</label><textarea id="sd" rows="2">${E(s.desc||'')}</textarea><label>WhatsApp de contact</label><input id="sw" type="tel" value="${E(s.wa||s.phone)}"><label>Devise</label><select id="sc"><option ${s.cur=='FC'?'selected':''}>FC</option><option ${s.cur=='USD'?'selected':''}>USD</option></select></div>
 <div class="card"><h3>🎨 Design de la boutique</h3><label>Couleur principale</label><input id="scol" type="color" value="${s.color||'#2563eb'}" style="height:48px;padding:4px"><label>Style</label><select id="sdk"><option value="0" ${s.dark?'':'selected'}>Clair</option><option value="1" ${s.dark?'selected':''}>Sombre</option></select><label>Police</label><select id="sf"><option value="m" ${s.font=='m'?'selected':''}>Moderne</option><option value="e" ${s.font=='e'?'selected':''}>Élégante</option><option value="r" ${s.font=='r'?'selected':''}>Arrondie</option></select></div>
 <div class="card"><h3>💳 Moyens de paiement</h3><small>Remplissez seulement ceux que vous avez. Aucun n’est obligatoire sauf un.</small><label>Nom du titulaire</label><input id="spn" value="${E(s.payname||'')}" placeholder="Nom qui apparaît sur le compte">${Object.keys(PM).map(k=>`<label>${PM[k][1]} ${PM[k][0]}${k=='equity'?' (numéro de compte)':' (numéro)'}</label><input id="pay_${k}" value="${E((s.pay||{})[k]||'')}">`).join('')}<label>Nom de l’autre moyen (si utilisé)</label><input id="spl" value="${E(s.payl||'')}"><label>Livraison</label><input id="sdl" value="${E(s.deliv||'')}" placeholder="Ex : livraison express partout, 24 h à Kinshasa"></div>
 <button class="btn gold" data-a="ssave">💾 Enregistrer ma boutique</button>`};
const tLink=()=>`<div class="card"><h3>🔗 Le lien de ma boutique</h3><div class="empty" style="word-break:break-all;color:var(--tx)">${E(link(SH.id))}</div><button class="btn" data-a="copy">📋 Copier le lien</button><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent('Visitez ma boutique '+SH.name+' : '+link(SH.id))}" target="_blank" rel="noopener">💬 Partager sur WhatsApp</a><a class="btn ghost2" href="#/s/${SH.id}">👁 Voir ma boutique comme un client</a></div><button class="btn gold inst" data-a="inst">📲 Installer l’application</button><div class="card"><h3>🚚 Besoin d’aide ?</h3><small>Pour installer l’application ou ouvrir une boutique pour quelqu’un, contactez Joseph Monsemvula.</small><a class="btn wa" href="${wl(WA)}" target="_blank" rel="noopener">💬 +243 897 997 253</a></div>`;

/* ---------- boutique publique ---------- */
const th=s=>`--ac:${E(s.color||'#2563eb')};${s.dark?'--bg:#0f1115;--cd:#1b1f27;--tx:#f3f4f6;--m:#9ca3af':'--bg:#f6f7fb;--cd:#fff;--tx:#111827;--m:#6b7280'};font-family:${{e:"Georgia,'Times New Roman',serif",r:"'Trebuchet MS',Verdana,sans-serif"}[s.font]||'system-ui,sans-serif'}`;
const ck=()=>'cart_'+STO.id,csave=()=>{try{localStorage[ck()]=JSON.stringify(cart)}catch{}};
const cinfo=()=>{const L=Object.entries(cart).map(([id,q])=>({p:PL.find(x=>x.id==id),q})).filter(x=>x.p);return{L,n:L.reduce((a,x)=>a+x.q,0),T:L.reduce((a,x)=>a+x.p.price*x.q,0)}};
async function store(slug){view('<div class="load">Chargement…</div>');let s;try{s=await getDoc(doc(db,'shops',slug||'_'))}catch{}
 if(!s||!s.exists()||s.data().status!='active')return view('<div class="center"><img class="logo" src="icon-192.png"><h2>Boutique indisponible</h2><p>Ce lien est invalide ou la boutique est temporairement fermée.</p><a class="btn gold" href="#/">Créer ma boutique</a></div>','hero');
 STO={id:s.id,...s.data()};PL=(await prods(slug)).filter(p=>!p.hide);fc='';fq='';try{cart=JSON.parse(localStorage[ck()]||'{}')}catch{cart={}};sv()}
function sv(){const s=STO,c=cinfo(),list=PL.filter(p=>(!fc||p.cat==fc)&&(!fq||p.name.toLowerCase().includes(fq))),cats=[...new Set(PL.map(p=>p.cat))];
 view(`<div class="st-w" style="${th(s)}"><div class="sh">${s.logo?`<img src="${s.logo}">`:''}<div><h1>${E(s.name)}</h1><p>${E(s.desc)}</p></div></div><div class="bar"><input id="fq" placeholder="🔍 Rechercher un produit" value="${E(fq)}"></div>
 <div class="chips"><button class="chip ${fc?'':'on'}" data-a="fc" data-k="">Tout</button>${cats.map(x=>`<button class="chip ${fc==x?'on':''}" data-a="fc" data-k="${E(x)}">${E(x)}</button>`).join('')}</div>
 <div class="grid">${list.map(p=>`<div class="pc" data-a="pv" data-k="${p.id}"><img src="${p.imgs?.[0]||'icon-192.png'}"><b>${E(p.name)}</b><span>${fm(p.price,s.cur)}</span><button class="btn sm" data-a="add" data-k="${p.id}">＋ Ajouter</button></div>`).join('')||'<div class="empty" style="grid-column:1/-1">Aucun produit pour le moment.</div>'}</div>
 <footer>${s.deliv?'🚚 '+E(s.deliv)+'<br>':''}<a href="${wl(s.wa||s.phone,'Bonjour '+s.name+', j’ai une question.')}" target="_blank" rel="noopener">💬 Contacter la boutique</a><br><br>Boutique créée avec <b>JOSSELL SHOP</b> • <a href="#/">Créer la mienne</a></footer>${c.n?`<button class="cartb" data-a="cart">🛒 ${c.n} • ${fm(c.T,s.cur)}</button>`:''}</div>`)}
function cartView(){const s=STO,{L,T}=cinfo(),pm=Object.entries(s.pay||{}).filter(([k,x])=>x&&PM[k]);
 modal(`<h3>🛒 Mon panier</h3>${L.map(x=>`<div class="row"><b>${E(x.p.name)}</b><button class="ic" data-a="qm" data-k="${x.p.id}">−</button><span>${x.q}</span><button class="ic" data-a="qp" data-k="${x.p.id}">＋</button></div>`).join('')||'<div class="empty">Panier vide</div>'}
 ${L.length?`<div class="row"><b>Total</b><b style="flex:none">${fm(T,s.cur)}</b></div><h4>Vos informations</h4><input id="cn" placeholder="Votre nom"><input id="cp" type="tel" placeholder="Votre téléphone"><input id="cc" placeholder="Ville / commune"><textarea id="ca" rows="2" placeholder="Adresse de livraison (facultatif)"></textarea><label class="chk"><input id="ce" type="checkbox"> 🚚 Livraison express partout en RDC (le vendeur vous contacte)</label><h4>Paiement</h4>${pm.length?pm.map(([k,n],i)=>`<label class="chk"><input type="radio" name="pm" value="${k}" ${i?'':'checked'}> ${PM[k][1]} ${E(PMN(k,s))} : <b>${E(n)}</b></label>`).join('')+`<small>Titulaire : ${E(s.payname||s.owner)}. Envoyez le montant total à ce numéro puis saisissez la référence de la transaction.</small><input id="cr" placeholder="Référence de la transaction (reçue par SMS)"><button class="btn" data-a="order" style="background:var(--ac)">✅ Confirmer la commande</button>`:'<div class="empty">Le vendeur n’a pas encore indiqué de moyen de paiement. Contactez-le sur WhatsApp.</div>'}`:''}<button class="link" data-a="close">Fermer</button>`);$('#modal').firstChild.style.cssText=th(STO)}
async function order(id){view('<div class="load">Chargement…</div>');let o;try{o=await getDoc(doc(db,'orders',id||'_'))}catch{}
 if(!o||!o.exists())return view('<div class="center"><img class="logo" src="icon-192.png"><h2>Commande introuvable</h2><a class="btn gold" href="#/">Accueil</a></div>','hero');
 o={id:o.id,...o.data()};const s=(await getDoc(doc(db,'shops',o.slug))).data()||{};
 view(`<div class="st-w" style="${th(s)}"><div class="sh"><div><h1>Commande reçue ✅</h1><p>${E(s.name)}</p></div></div><div style="padding:14px;display:grid;gap:12px"><div class="card"><div class="row"><b>${E(o.cname)}</b><span class="st ${o.status}">${ST[o.status]}</span></div>${o.items.map(i=>`<div class="row"><span>${i.q} × ${E(i.n)}</span><b style="flex:none">${fm(i.p*i.q,o.cur)}</b></div>`).join('')}<div class="row"><b>Total</b><b style="flex:none">${fm(o.total,o.cur)}</b></div><small>Paiement : ${E(PMN(o.pm,s))} • Réf : ${E(o.ref||'—')}<br>Le vendeur vérifie votre paiement puis confirme. Gardez ce lien pour suivre votre commande.</small></div>
 ${(o.files||[]).length?`<div class="card"><h3>📥 Vos fichiers</h3>${o.files.map(f=>`<a class="btn" href="${E(f.u)}" target="_blank" rel="noopener" style="background:var(--ac)">${E(f.n)}</a>`).join('')}</div>`:''}<a class="btn wa" href="${wl(s.wa||s.phone,'Bonjour, je suis '+o.cname+'. Commande : '+location.href)}" target="_blank" rel="noopener">💬 Écrire au vendeur</a><a class="btn ghost2" href="#/s/${E(o.slug)}">← Retour à la boutique</a></div></div>`)}

/* ---------- administration ---------- */
async function admin(){if(!U||U.email!=ADM){location.hash='#/';return}
 view('<div class="load">Chargement…</div>');const[S,O]=await Promise.all([getDocs(collection(db,'shops')),getDocs(collection(db,'orders'))]);
 AS=S.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);AO=O.docs.map(d=>({id:d.id,...d.data()}));ar()}
function stat(s){const o=AO.filter(x=>x.slug==s.id&&x.status!='cancelled'),c=sum(o,'commission');return{n:o.length,sales:sum(o,'total'),com:c,due:Math.max(0,c-(s.cpaid||0))}}
function ar(){const cur={};AS.forEach(s=>{const t=stat(s),c=cur[s.cur]||(cur[s.cur]={sales:0,com:0,paid:0,due:0});c.sales+=t.sales;c.com+=t.com;c.paid+=s.cpaid||0;c.due+=t.due});
 const q=($('#aq')?.value||'').toLowerCase();
 view(`<header class="top"><b>🛠️ Administration</b><button class="ic" data-a="out">⏻</button></header><div id="body"><div class="card"><h3>📊 Plateforme</h3><div class="kp"><div class="k a"><span>Boutiques</span><b>${AS.length}</b></div><div class="k b"><span>Actives</span><b>${AS.filter(s=>s.status=='active').length}</b></div></div>${Object.entries(cur).map(([c,t])=>`<div class="empty" style="color:var(--tx)">Ventes ${fm(t.sales,c)}<br>Commission 10 % : <b>${fm(t.com,c)}</b> • reçue ${fm(t.paid,c)} • <b>à recevoir ${fm(t.due,c)}</b></div>`).join('')}</div>
 <div class="card"><h3>🔑 Code d’accès pour un numéro</h3><input id="ap" type="tel" placeholder="Téléphone du vendeur"><button class="btn gold" data-a="acode" data-k="">Générer le code à 4 chiffres</button>${GC._last?`<div class="empty" style="color:var(--tx)">${E(GC._last)}</div>`:''}</div>
 <input id="aq" placeholder="🔍 Rechercher un compte" value="${E(q)}">${AS.filter(s=>(s.name+s.owner+s.phone).toLowerCase().includes(q)).map(s=>{const t=stat(s);return `<div class="card"><div class="row"><b>${E(s.name)}<small style="display:block;font-weight:400">${E(s.owner)} • ${E(s.phone)}</small></b><span class="st ${s.status=='active'?'paid':s.status=='blocked'?'blocked':'new'}">${{active:'Actif',pending:'En attente',blocked:'Bloqué'}[s.status]}</span></div><small>${t.n} commande(s) • ventes ${fm(t.sales,s.cur)}<br>Commission ${fm(t.com,s.cur)} • reçue ${fm(s.cpaid||0,s.cur)} • <b>à recevoir ${fm(t.due,s.cur)}</b></small>${GC[s.ph9]?`<div class="empty" style="color:var(--tx)">Code : <b>${GC[s.ph9]}</b> <a href="${wl(s.phone,'Votre code d’accès JOSSELL SHOP : '+GC[s.ph9])}" target="_blank" rel="noopener">💬 envoyer</a></div>`:''}<div class="row wrap"><button class="btn sm" data-a="acode" data-k="${s.ph9}">🔑 Code</button><button class="btn sm ${s.status=='blocked'?'':'red'}" data-a="ablock" data-k="${s.id}">${s.status=='blocked'?'✅ Débloquer':'🚫 Bloquer'}</button><button class="btn sm gold" data-a="acom" data-k="${s.id}">💰 Commission reçue</button><a class="btn sm ghost2" href="#/s/${s.id}">👁</a><a class="btn sm wa" href="${wl(s.phone)}" target="_blank" rel="noopener">💬</a><button class="ic" data-a="adel" data-k="${s.id}">🗑</button></div></div>`}).join('')||'<div class="empty">Aucun compte.</div>'}<a class="btn ghost2" href="#/" data-a="aexit">← Quitter l’administration</a></div>`)}

/* ---------- actions ---------- */
const A={
 inst:async()=>{if(!dp)return;dp.prompt();const r=await dp.userChoice;dp=null;if(r.outcome=='accepted')document.body.classList.remove('canin')},
 out:async()=>{await signOut(auth);U=null;SH=null;location.hash='#/';route()},
 close,
 dologin:async()=>{try{await signInWithEmailAndPassword(auth,norm(v('lph'))+DOM,$('#lpw').value);location.hash='#/'}catch(e){toast(aerr(e))}},
 dosignup:async()=>{const n=v('gn'),sn=v('gs'),ph=norm(v('gp')),pw=$('#gw').value;if(!n||!sn)return toast('Nom et boutique obligatoires');if(ph.length<11)return toast('Numéro invalide');if(pw.length<6)return toast('Mot de passe : 6 caractères minimum');if(!$('#gt').checked)return toast('Veuillez accepter les conditions');
  busy=1;try{const c=await createUserWithEmailAndPassword(auth,ph+DOM,pw);U=c.user;let slug=slugify(sn)||'boutique';if((await getDoc(doc(db,'shops',slug))).exists())slug+='-'+Math.random().toString(36).slice(2,5);
   await setDoc(doc(db,'shops',slug),{uid:U.uid,owner:n,phone:ph,ph9:ph.slice(-9),name:sn,desc:'',status:'pending',cpaid:0,cur:'FC',color:'#2563eb',dark:0,font:'m',pay:{},wa:ph,created:Date.now()});await load();busy=0;location.hash='#/';route()}catch(e){busy=0;toast(aerr(e))}},
 act:async()=>{const c=v('ac');if(!/^\d{4}$/.test(c))return toast('Entrez le code à 4 chiffres');try{await updateDoc(doc(db,'shops',SH.id),{status:'active',try:c});await updateDoc(doc(db,'shops',SH.id),{try:''});await load();toast('✅ Boutique activée');route()}catch(e){toast('Code incorrect')}},
 tab:k=>{tab=k;ED=null;tabRender()},
 ost:async k=>{const[id,st]=k.split('|'),o=OR.find(x=>x.id==id),p={status:st};if(st=='paid'){p.files=[];for(const i of o.items){try{const d=await getDoc(doc(db,'private',i.id));if(d.exists()&&d.data().dl)p.files.push({n:i.n,u:d.data().dl})}catch{}}}
  await updateDoc(doc(db,'orders',id),p);toast('✅ Commande mise à jour');tabRender()},
 padd:()=>{ED={};PH=[];tabRender()},pcancel:()=>{ED=null;tabRender()},
 pedit:async k=>{ED={...PL.find(p=>p.id==k)};PH=[...(ED.imgs||[])];try{const d=await getDoc(doc(db,'private',k));ED.dl=d.exists()?d.data().dl:''}catch{}tabRender()},
 prm:k=>{PH.splice(+k,1);$('#th').innerHTML=thumbs()},
 pdel:async k=>{if(!confirm('Supprimer ce produit ?'))return;await deleteDoc(doc(db,'products',k));tabRender()},
 psave:async()=>{const n=v('pn'),p=v('pp');if(!n||p==='')return toast('Nom et prix obligatoires');const id=ED.id||doc(collection(db,'products')).id;
  try{await setDoc(doc(db,'products',id),{slug:SH.id,uid:U.uid,name:n,price:+p,cat:v('pc'),desc:v('pd'),imgs:PH,hide:$('#ph').checked,created:ED.created||Date.now()});await setDoc(doc(db,'private',id),{uid:U.uid,dl:v('pl')});ED=null;toast('✅ Produit enregistré');tabRender()}catch(e){toast('Erreur : '+(e.code||e.message))}},
 ssave:async()=>{const pay={};Object.keys(PM).forEach(k=>{const x=v('pay_'+k);if(x)pay[k]=x});if(!v('sn'))return toast('Nom de boutique obligatoire');
  const d={name:v('sn'),desc:v('sd'),wa:norm(v('sw'))||SH.phone,cur:v('sc'),color:v('scol'),dark:+v('sdk'),font:v('sf'),payname:v('spn'),payl:v('spl'),deliv:v('sdl'),pay};if(LOGO)d.logo=LOGO;
  try{await updateDoc(doc(db,'shops',SH.id),d);await load();toast('✅ Boutique enregistrée');tabRender()}catch(e){toast('Erreur : '+(e.code||e.message))}},
 copy:async()=>{try{await navigator.clipboard.writeText(link(SH.id));toast('✅ Lien copié')}catch{toast('Copiez le lien manuellement')}},
 fc:k=>{fc=k;sv()},pv:k=>{const p=PL.find(x=>x.id==k);modal(`<div class="snap">${(p.imgs?.length?p.imgs:['icon-192.png']).map(i=>`<img src="${i}">`).join('')}</div><h3>${E(p.name)}</h3><b style="color:var(--ac);font-size:20px">${fm(p.price,STO.cur)}</b><small>${E(p.cat)}</small><p>${E(p.desc)}</p><button class="btn" data-a="add" data-k="${p.id}" style="background:var(--ac)">＋ Ajouter au panier</button><button class="link" data-a="close">Fermer</button>`);$('#modal').firstChild.style.cssText=th(STO)},
 add:k=>{cart[k]=(cart[k]||0)+1;csave();close();sv();toast('🛒 Ajouté au panier')},
 cart:cartView,qm:k=>{if(--cart[k]<=0)delete cart[k];csave();cartView();sv()},qp:k=>{cart[k]++;csave();cartView();sv()},
 order:async()=>{const s=STO,{L,T}=cinfo(),nm=v('cn'),ph=v('cp'),pm=document.querySelector('[name=pm]:checked')?.value,ref=v('cr');if(!nm||norm(ph).length<9)return toast('Votre nom et téléphone sont obligatoires');if(!ref)return toast('Saisissez la référence du paiement');
  try{const r=await addDoc(collection(db,'orders'),{slug:s.id,uid:s.uid,items:L.map(x=>({id:x.p.id,n:x.p.name,p:x.p.price,q:x.q})),total:T,commission:Math.round(T*10)/100,cur:s.cur,cname:nm,cphone:norm(ph),city:v('cc'),addr:v('ca'),express:$('#ce').checked,pm,ref,status:'new',files:[],created:Date.now()});cart={};csave();close();location.hash='#/o/'+r.id}catch(e){toast('Commande impossible : '+(e.code||e.message))}},
 acode:async k=>{const p=k||norm(v('ap')).slice(-9);if(p.length<9)return toast('Numéro invalide');const c=String(Math.floor(1000+Math.random()*9000));await setDoc(doc(db,'codes',p),{code:c,t:Date.now()});GC[p]=c;GC._last=k?'':'Code pour '+p+' : '+c;ar();toast('✅ Code généré')},
 ablock:async k=>{const s=AS.find(x=>x.id==k),st=s.status=='blocked'?'active':'blocked';await updateDoc(doc(db,'shops',k),{status:st});s.status=st;ar()},
 acom:async k=>{const s=AS.find(x=>x.id==k),x=+prompt('Commission reçue ('+s.cur+') pour '+s.name);if(!(x>0))return;await updateDoc(doc(db,'shops',k),{cpaid:(s.cpaid||0)+x});s.cpaid=(s.cpaid||0)+x;ar()},
 adel:async k=>{if(!confirm('Supprimer définitivement ce compte boutique ?'))return;await deleteDoc(doc(db,'shops',k));AS=AS.filter(x=>x.id!=k);ar()},
 aexit:async(k,b)=>{await signOut(auth);U=null}
};
document.addEventListener('click',async e=>{if(e.target.closest('.tap10'))tap10();if(e.target.id=='modal')close();const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){try{await A[b.dataset.a](b.dataset.k,b)}catch(x){toast(x.code=='permission-denied'?'Autorisation refusée : publiez d’abord les règles Firebase (voir ETAPE-1).':'Erreur : '+(x.code||x.message))}}});
document.addEventListener('input',e=>{if(e.target.id=='fq'){fq=e.target.value.toLowerCase();sv();const f=$('#fq');f.focus();f.setSelectionRange(f.value.length,f.value.length)}if(e.target.id=='aq')ar()});
document.addEventListener('change',async e=>{if(e.target.id=='pf'){for(const f of e.target.files){if(PH.length<3)PH.push(await rs(f,800,.7))}$('#th').innerHTML=thumbs()}
 if(e.target.id=='sl'&&e.target.files[0]){LOGO=await rs(e.target.files[0],200,.8);toast('Logo prêt : touchez Enregistrer')}});
</script></body></html>
