const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function adm() { return request.auth != null && request.auth.token.email == 'joseph.admin@josselshop.app'; }\n    function me(u) { return request.auth != null && request.auth.uid == u; }\n    function shopOf(s) { return get(/databases/$(database)/documents/shops/$(s)).data; }\n\n    match /shops/{s} {\n      allow read: if true;\n      allow create: if me(request.resource.data.uid) && request.resource.data.status == 'pending' && request.resource.data.cpaid == 0;\n      allow update: if adm() || (me(resource.data.uid)\n        && request.resource.data.uid == resource.data.uid\n        && request.resource.data.cpaid == resource.data.cpaid\n        && (request.resource.data.status == resource.data.status\n            || (resource.data.status == 'pending' && request.resource.data.status == 'active'\n                && request.resource.data.get('try', '') == get(/databases/$(database)/documents/codes/$(resource.data.ph9)).data.code)));\n      allow delete: if adm();\n    }\n    match /products/{p} {\n      allow read: if true;\n      allow create: if me(request.resource.data.uid) && shopOf(request.resource.data.slug).uid == request.auth.uid && shopOf(request.resource.data.slug).status == 'active';\n      allow update, delete: if adm() || me(resource.data.uid);\n    }\n    match /private/{p} {\n      allow create: if me(request.resource.data.uid);\n      allow read, update, delete: if adm() || me(resource.data.uid);\n    }\n    match /orders/{o} {\n      allow get: if true;\n      allow list: if adm() || (request.auth != null && resource.data.uid == request.auth.uid);\n      allow create: if request.resource.data.status == 'new' && shopOf(request.resource.data.slug).status == 'active' && request.resource.data.uid == shopOf(request.resource.data.slug).uid;\n      allow update: if adm() || (me(resource.data.uid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','files']))\n        || (resource.data.status == 'new' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['ref']));\n      allow delete: if adm();\n    }\n    match /codes/{c} { allow read, write: if adm(); }\n  }\n}\n";
